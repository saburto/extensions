name: Publish to npm (manual)

on:
  workflow_dispatch:
    inputs:
      workspace:
        description: 'Workspace directory to publish, e.g. extensions/colorful-footer'
        required: true
        default: extensions/colorful-footer

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: bun install --frozen-lockfile

      - name: Publish ${{ inputs.workspace }}
        run: npm publish --workspace "${{ inputs.workspace }}" --access public
