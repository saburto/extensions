name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # paths_released is a JSON array of workspace paths that got a release
      released_paths: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    # Runs after release-please bumps the version and creates a release.
    needs: release-please
    # Only run when colorful-footer was actually released. The path keeps its
    # `/` — release-please sets outputs as `<path>--release_created`.
    if: ${{ contains(fromJSON(needs.release-please.outputs.released_paths), 'extensions/colorful-footer') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm Trusted Publishing (OIDC). No npm token needed:
      # npm exchanges the short-lived GitHub OIDC token and generates
      # provenance attestations automatically.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never use caching in release builds

      - run: bun install --frozen-lockfile

      - name: Publish @saburto/pi-colorful-footer
        run: npm publish --workspace extensions/colorful-footer --access public

  publish-notify-fullscreen:
    # Runs after release-please bumps the version and creates a release.
    needs: release-please
    # Only run when pi-notify-fullscreen was actually released.
    if: ${{ contains(fromJSON(needs.release-please.outputs.released_paths), 'extensions/pi-notify-fullscreen') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never use caching in release builds

      - run: bun install --frozen-lockfile

      - name: Publish @saburto/pi-notify-fullscreen
        run: npm publish --workspace extensions/pi-notify-fullscreen --access public
